name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate source
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Smoke-test static output
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/magi-site-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:4173/ | grep -q "FOLDERS"
          curl --fail --silent --show-error http://127.0.0.1:4173/data/releases.json | grep -q "madeinmagius-release-snapshot"
          curl --fail --silent --show-error http://127.0.0.1:4173/data/exedra-docs.json | grep -q "magiuslink-exedra-docs"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
