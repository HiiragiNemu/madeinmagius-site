name: Probe JP upstream XAPK

on:
  push:
    paths:
      - ".github/workflows/probe-jp-upstream.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect APKPure JP latest headers
        run: |
          set -e
          curl -sSIL --max-redirs 8 -A "Mozilla/5.0 MagiusLink/1.0"             "https://d.apkpure.net/b/XAPK/com.aniplex.magia.exedra.jp?version=latest"             | sed -n '1,120p'
