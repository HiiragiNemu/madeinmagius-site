name: Probe legacy release routes

on:
  push:
    paths:
      - ".github/workflows/probe-legacy-routes.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect old NetEase download metadata
        run: |
          set -e
          curl -fsSL "https://bilibili-follower-snapshot.pages.dev/netease/" -o /tmp/netease.html
          grep -Ein 'v2\.5\.1|SHA-256|大小|Android|Windows|Python|wheel|source|manifest|签名|完整版|商店版|GooglePlay' /tmp/netease.html | head -n 220
