name: Probe legacy Bilibili downloads

on:
  push:
    paths:
      - ".github/workflows/probe-old-downloads.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect legacy Bilibili page
        run: |
          set -e
          curl -fsSL "https://bilibili-follower-snapshot.pages.dev/bilibili/" -o /tmp/bili.html
          echo "=== HREFS ==="
          grep -Eo 'href="[^"]+"' /tmp/bili.html | sed 's/^/LINK /'
          echo "=== SCRIPT SOURCES ==="
          grep -Eo 'src="[^"]+"' /tmp/bili.html | sed 's/^/SRC /'
          echo "=== DOWNLOAD RELATED ==="
          grep -Ein 'apk|user\.js|download|sha256|伴侣|脚本' /tmp/bili.html | head -n 120 || true
