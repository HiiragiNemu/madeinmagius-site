name: Probe legacy Bilibili downloads

on:
  push:
    paths:
      - ".github/workflows/probe-old-downloads.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect legacy site download links
        run: |
          set -e
          curl -fsSL "https://bilibili-follower-snapshot.pages.dev/" -o /tmp/site.html
          echo "=== DOWNLOAD HREFS ==="
          grep -Eo 'href="[^"]+"' /tmp/site.html | grep -Ei 'download|apk|user\.js|zip' || true
          echo "=== DOWNLOAD TEXT ==="
          grep -Ein 'apk|userscript|download|下载' /tmp/site.html | head -n 80 || true
