name: Probe legacy Bilibili downloads

on:
  push:
    paths:
      - ".github/workflows/probe-old-downloads.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect legacy Bilibili guide
        run: |
          set -e
          curl -fsSL "https://bilibili-follower-snapshot.pages.dev/bilibili/" -o /tmp/bili.html
          sed -n '90,124p' /tmp/bili.html
