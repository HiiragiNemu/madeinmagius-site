name: Validate Bilibili userscript route

on:
  push:
    branches:
      - fix/bilibili-userscript-0.2.11

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm run check
