name: Validate dynamic Bilibili Android update

on:
  push:
    branches:
      - feat/bilibili-dynamic-android-update

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm run check
