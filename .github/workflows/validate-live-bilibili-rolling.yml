name: Verify live Bilibili rolling baseline

on:
  push:
    branches:
      - fix/bilibili-android-copy-by-release

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Execute live userscript A to B to C regression
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://madeinmagius-site.pages.dev/downloads/bilibili-follower-snapshot.user.js?rolling-live=1' -o /tmp/bili.user.js
          grep -q 'version      0.2.11' /tmp/bili.user.js
          cat >/tmp/rolling.mjs <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import vm from 'node:vm';

          const source = fs.readFileSync('/tmp/bili.user.js', 'utf8').replaceAll('\r\n', '\n');
          const context = {
            __BILI_FOLLOWER_MOBILE_TEST_MODE__: true,
            console,
            setTimeout,
            clearTimeout,
            URL,
            URLSearchParams,
            performance,
            AbortController,
          };
          vm.runInNewContext(source, context, { filename: 'live-bili.user.js' });
          const core = context.__BILI_FOLLOWER_MOBILE_TEST_HOOKS__;
          assert.ok(core);

          class Store {
            constructor() { this.values = new Map(); }
            get length() { return this.values.size; }
            key(index) { return [...this.values.keys()][index] ?? null; }
            getItem(key) { return this.values.has(key) ? this.values.get(key) : null; }
            setItem(key, value) { this.values.set(key, String(value)); }
            removeItem(key) { this.values.delete(key); }
          }
          const snapshot = (time, ids) => ({
            reportType: 'bilibili-current-follower-snapshot',
            reportVersion: 'live-fixture',
            generatedAt: time,
            targetUid: 100,
            targetName: 'fixture',
            initialReportedTotal: ids.length,
            finalReportedTotal: ids.length,
            exportedUniqueTotal: ids.length,
            complete: true,
            followers: ids.map(uid => ({ uid, name: 'u' + uid })),
          });

          const store = new Store();
          const a = snapshot('2026-09-22T01:00:00.000Z', [1, 2]);
          const b = snapshot('2026-09-22T02:00:00.000Z', [1, 3]);
          const c = snapshot('2026-09-22T03:00:00.000Z', [1, 3, 4]);

          assert.equal(core.tryPersistLatestComplete(a, store).saved, true);
          const ab = core.compareCompleteSnapshots(core.readLastComplete(100, store).report, b);
          const txAB = core.persistDetectedChangeBeforeBaseline(ab, b, store);
          assert.equal(txAB.pending.saved, true);
          assert.equal(txAB.baseline.saved, true);
          assert.deepEqual(Array.from(ab.removed, x => x.uid), [2]);
          assert.deepEqual(Array.from(ab.added, x => x.uid), [3]);

          const baselineB = core.readLastComplete(100, store).report;
          assert.equal(baselineB.generatedAt, b.generatedAt);
          const bc = core.compareCompleteSnapshots(baselineB, c);
          assert.deepEqual(Array.from(bc.removed, x => x.uid), []);
          assert.deepEqual(Array.from(bc.added, x => x.uid), [4]);

          const txBC = core.persistDetectedChangeBeforeBaseline(
            bc,
            c,
            store,
            core.readPendingChange(100, store).envelope,
          );
          assert.equal(txBC.pending.saved, true);
          assert.equal(txBC.baseline.saved, true);
          assert.equal(core.readLastComplete(100, store).report.generatedAt, c.generatedAt);
          assert.equal(core.readPendingChange(100, store).envelope.comparisons.length, 2);
          console.log('LIVE_ROLLING_BASELINE_PASS');
          NODE
          node /tmp/rolling.mjs
