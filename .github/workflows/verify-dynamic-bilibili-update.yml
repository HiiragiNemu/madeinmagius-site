name: Verify dynamic Bilibili update route

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          URL='https://madeinmagius-site.pages.dev/updates/bilibili/android.json'

          expected_version="$(node -p "require('./data/releases.json').projects.bilibili.tag.replace(/^v/,'')")"
          expected_sha="$(node -p "require('./data/releases.json').projects.bilibili.assets.android.digest.replace(/^sha256:/,'').toLowerCase()")"

          echo "expected version=$expected_version sha256=$expected_sha"

          ok=0
          for attempt in $(seq 1 24); do
            code="$(curl -sS -D /tmp/headers -o /tmp/body -w '%{http_code}' "$URL?verify=$GITHUB_RUN_ID-$attempt")"
            source="$(tr -d '\r' </tmp/headers | sed -n 's/^x-update-source: //Ip' | tail -1)"
            version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' /tmp/body | head -1)"
            version_code="$(sed -n 's/.*"versionCode": \([0-9][0-9]*\).*/\1/p' /tmp/body | head -1)"
            sha256="$(sed -n 's/.*"sha256": "\([0-9a-fA-F][0-9a-fA-F]*\)".*/\1/p' /tmp/body | head -1 | tr '[:upper:]' '[:lower:]')"
            echo "attempt=$attempt http=$code source=$source version=$version versionCode=$version_code sha256=$sha256"

            if [[ "$code" = "200" &&
                  "$source" = "verified-latest-release" &&
                  "$version" = "$expected_version" &&
                  "$sha256" = "$expected_sha" &&
                  "$version_code" =~ ^[0-9]+$ ]] && (( version_code > 11 )); then
              grep -q '"packageName": "io.github.hiiraginemu.bilibilifollowersnapshot.companion"' /tmp/body
              ok=1
              break
            fi

            sleep 10
          done

          test "$ok" = 1
          echo DYNAMIC_UPDATE_ROUTE_PASS
