name: Verify dynamic Bilibili update route

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          URL='https://madeinmagius-site.pages.dev/updates/bilibili/android.json'
          ok=0
          for attempt in $(seq 1 24); do
            code="$(curl -sS -D /tmp/headers -o /tmp/body -w '%{http_code}' "$URL?verify=$GITHUB_RUN_ID-$attempt")"
            source="$(tr -d '\r' </tmp/headers | sed -n 's/^x-update-source: //Ip' | tail -1)"
            version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' /tmp/body | head -1)"
            echo "attempt=$attempt http=$code source=$source version=$version"
            if [[ "$code" = "200" && "$source" = "verified-fallback" && "$version" = "0.1.10" ]]; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          grep -q '"versionCode": 11' /tmp/body
          grep -q '"sha256": "89999ea9941128f53d9dcec7ebeaf23d5c981c59e974445042e90933f06956fd"' /tmp/body
          echo DYNAMIC_UPDATE_ROUTE_PASS
