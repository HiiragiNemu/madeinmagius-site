name: Verify live Bilibili distribution

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production routes with diagnostics
        shell: bash
        run: |
          set -euo pipefail
          CF='https://madeinmagius-site.pages.dev'
          GH='https://hiiraginemu.github.io/madeinmagius-site'
          SCRIPT_SHA='831c82dcfc86b3eac0127dad2485bb48825159201bbf189882e476bf89345eb2'
          APK_SHA='89999ea9941128f53d9dcec7ebeaf23d5c981c59e974445042e90933f06956fd'

          fetch() {
            local label="$1" url="$2" out="$3"
            echo "===== $label ====="
            local code
            code="$(curl -sS -L -D "/tmp/${label}.headers" -o "$out" -w '%{http_code}' "$url")"
            echo "HTTP $code"
            sed -n '1,30p' "/tmp/${label}.headers"
            echo "bytes=$(wc -c <"$out")"
            if [[ "$code" != "200" && "$code" != "206" ]]; then
              head -c 2000 "$out" || true
              echo
              return 1
            fi
          }

          ready=0
          for attempt in $(seq 1 18); do
            if fetch releases "$CF/api/releases?verify=$GITHUB_RUN_ID-$attempt" /tmp/releases.json \
              && grep -q 'bilibili-follower-snapshot-v0.2.11.user.js' /tmp/releases.json \
              && grep -q "$SCRIPT_SHA" /tmp/releases.json; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = 1

          fetch install "$CF/downloads/bilibili-follower-snapshot.user.js?verify=$GITHUB_RUN_ID" /tmp/install.user.js
          grep -n '^// @version' /tmp/install.user.js | head
          tr -d '\r' </tmp/install.user.js | grep -q '^// @version      0.2.11
          echo 'actual userscript sha256:'
          sha256sum /tmp/install.user.js

          fetch manual "$CF/downloads/bilibili/userscript?verify=$GITHUB_RUN_ID" /tmp/manual.user.js
          cmp /tmp/install.user.js /tmp/manual.user.js

          fetch update "$CF/updates/bilibili/android.json?verify=$GITHUB_RUN_ID" /tmp/android.json
          cat /tmp/android.json
          grep -q '"version": "0.1.10"' /tmp/android.json
          grep -q '"versionCode": 11' /tmp/android.json
          ! grep -q '"version": "0.1.11"' /tmp/android.json

          fetch apk "$CF/downloads/bilibili/android?verify=$GITHUB_RUN_ID" /tmp/current.apk
          echo "$APK_SHA  /tmp/current.apk" | sha256sum -c -

          fetch ghmeta "$GH/data/releases.json?verify=$GITHUB_RUN_ID" /tmp/gh-releases.json
          grep -q 'bilibili-follower-snapshot-v0.2.11.user.js' /tmp/gh-releases.json
          grep -q 'bilibili-follower-snapshot-v0.2.11.user.js' /tmp/gh-releases.json

          fetch ghcontent "$GH/assets/content.js?verify=$GITHUB_RUN_ID" /tmp/content.js
          grep -q 'MediaStore' /tmp/content.js
          grep -q 'N-1' /tmp/content.js

          echo 'LIVE_DISTRIBUTION_PASS'

          echo 'actual userscript sha256:'
          sha256sum /tmp/install.user.js

          fetch manual "$CF/downloads/bilibili/userscript?verify=$GITHUB_RUN_ID" /tmp/manual.user.js
          cmp /tmp/install.user.js /tmp/manual.user.js

          fetch update "$CF/updates/bilibili/android.json?verify=$GITHUB_RUN_ID" /tmp/android.json
          cat /tmp/android.json
          grep -q '"version": "0.1.10"' /tmp/android.json
          grep -q '"versionCode": 11' /tmp/android.json
          ! grep -q '"version": "0.1.11"' /tmp/android.json

          fetch apk "$CF/downloads/bilibili/android?verify=$GITHUB_RUN_ID" /tmp/current.apk
          echo "$APK_SHA  /tmp/current.apk" | sha256sum -c -

          fetch ghmeta "$GH/data/releases.json?verify=$GITHUB_RUN_ID" /tmp/gh-releases.json
          grep -q 'bilibili-follower-snapshot-v0.2.11.user.js' /tmp/gh-releases.json
          grep -q 'bilibili-follower-snapshot-v0.2.11.user.js' /tmp/gh-releases.json

          fetch ghcontent "$GH/assets/content.js?verify=$GITHUB_RUN_ID" /tmp/content.js
          grep -q 'MediaStore' /tmp/content.js
          grep -q 'N-1' /tmp/content.js

          echo 'LIVE_DISTRIBUTION_PASS'
