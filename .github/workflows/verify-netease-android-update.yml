name: Verify NetEase Android update route

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run repository checks
        run: npm run check

      - name: Verify deployed snapshot, latest release and APK bytes
        run: node scripts/verify-netease-android-update.mjs
