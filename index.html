<!doctype html>
<html lang="zh-CN" data-pixel-font="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020a05">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="MadeInMagius / MAGIUS LINK — software, tools and guides in a CRT terminal interface.">
  <title>MAGIUS LINK // Made In Magius</title>
  <!-- Apply the platform policy before CSS or body paint; do not touch saved preferences. -->
  <script id="crt-platform-bootstrap">
    (() => {
      const ios = /AppleWebKit/.test(navigator.userAgent) &&
        (/iPhone|iPad|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));
      document.documentElement.dataset.crtPlatform = ios ? 'ios-webkit' : 'standard';
      if (ios) document.documentElement.dataset.crtEngine = 'ios-static-css';
    })();
  </script>
  <link rel="icon" href="./assets/magius-mark.svg?v=20260920-boot2" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/styles.css?v=20260921-iosnative1">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <filter id="crt-warp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feImage id="crt-warp-map" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="lens"/>

        <!-- RGB registration is applied by the emitted UI text/shadows.
             Keep this full-screen filter short on high-DPR phones. -->
        <!-- Static tube curvature. -->
        <feDisplacementMap id="curve-displacement" in="SourceGraphic" in2="lens" scale="46" xChannelSelector="R" yChannelSelector="G" result="curved"/>
        <!-- Reduced horizontal bandwidth and a faint delayed tape echo, not
             just sharp RGB outlines. CSS-pixel units also soften high-DPR UI. -->
        <feGaussianBlur in="curved" stdDeviation=".72 .38" result="soft-signal"/>
        <feOffset in="soft-signal" dx="1.6" dy="0" result="tape-echo"/>
        <feComposite in="soft-signal" in2="tape-echo" operator="arithmetic" k2=".86" k3=".14"/>
      </filter>
    </defs>
  </svg>

  <div class="bezel" aria-label="Magius Link CRT terminal">
    <div class="screen">
      <div id="signal" class="signal">
        <div id="boot" class="boot" aria-live="polite">
          <div class="boot__raster" aria-hidden="true"></div>
          <div class="boot__grain" aria-hidden="true"></div>
          <div class="boot__roll" aria-hidden="true"></div>
          <div class="boot__signal">
            <img class="boot__emblem" src="./assets/magius-emblem-tight.svg?v=20260921-iosnative1" alt="">
            <img class="boot__wordmark" src="./assets/magius-link-wordmark.svg?v=20260920-boot2" alt="MAGIUS LINK">
            <div class="boot__loading">LOADING <i></i> 数据加载中</div>
          </div>
        </div>

        <canvas id="noise" class="noise" aria-hidden="true"></canvas>
        <div class="tube-grain" aria-hidden="true"></div>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="phosphor-grid" aria-hidden="true"></div>
        <div class="rolling-band" aria-hidden="true"></div>
        <div id="tracking-sweep" class="tracking-sweep" data-mode="down" aria-hidden="true"><span class="tracking-line tracking-line--a"></span><span class="tracking-line tracking-line--b"></span></div>
        <div class="mouse-glow" aria-hidden="true"></div>
        <div class="tear-band" aria-hidden="true"></div>

        <header class="masthead">
          <div class="masthead__bar">
            <button id="pixel-toggle" class="pixel-toggle" type="button" aria-pressed="true" title="全局像素字体">PIXEL ON</button>
            <span></span>
            <a id="home-jump" class="home-jump" href="#home/welcome" aria-label="返回 MAGIUS LINK 主页" title="HOME">▣</a>
          </div>
          <div class="masthead__row">
            <span class="masthead__node">MAGIUS LINK / NODE 01</span>
            <h1>MADE IN MAGIUS</h1>
            <span id="clock" class="masthead__clock">--:--:--</span>
          </div>
        </header>

        <main class="terminal-ui">
          <aside class="folders" aria-label="Programs">
            <div class="section-label">FOLDERS</div>
            <nav id="program-menu" class="program-menu">
              <button class="menu-node is-selected" type="button" data-program="home">
                <span class="menu-node__index">01</span>
                <span class="menu-node__copy"><b>&gt;HOME</b><small>MAGIUS LINK</small></span>
                <span class="menu-node__glyph">◆</span>
              </button>
              <button class="menu-node" type="button" data-program="bilibili">
                <span class="menu-node__index">02</span>
                <span class="menu-node__copy"><b>&gt;BILIBILI</b><small>粉丝快照</small></span>
                <span class="menu-node__glyph">◆</span>
              </button>
              <button class="menu-node" type="button" data-program="netease">
                <span class="menu-node__index">03</span>
                <span class="menu-node__copy"><b>&gt;NETEASE</b><small>歌单导出</small></span>
                <span class="menu-node__glyph">◆</span>
              </button>
              <button class="menu-node" type="button" data-program="exedra">
                <span class="menu-node__index">04</span>
                <span class="menu-node__copy"><b>&gt;EXEDRA TW / JP</b><small>下载与安装教程</small></span>
                <span class="menu-node__glyph">◆</span>
              </button>
              <button class="menu-node" type="button" data-program="about">
                <span class="menu-node__index">05</span>
                <span class="menu-node__copy"><b>&gt;ABOUT</b><small>MadeInMagius</small></span>
                <span class="menu-node__glyph">◆</span>
              </button>
            </nav>
          </aside>

          <section id="stage" class="stage" aria-live="polite">
            <div class="brand-watermark" aria-hidden="true">
              <img class="brand-emblem" src="./assets/magius-mark.svg?v=20260920-boot2" alt="">
              <img class="brand-wordmark" src="./assets/magius-link-wordmark.svg?v=20260920-boot2" alt="">
            </div>

            <svg id="connectors" class="connectors" aria-hidden="true"></svg>

            <div class="subsystem">
              <div class="section-label">SUBSYSTEM</div>
              <nav id="sub-menu" class="sub-menu" aria-label="Subsystem options"></nav>
            </div>

            <section id="content-panel" class="content-panel" tabindex="0">
              <div id="content-inner" class="content-inner"></div>
            </section>
          </section>
        </main>

        <footer class="statusbar">
          <span id="status-line">SELECT PROGRAM</span>
          <span class="controls">↑ ↓ SELECT&nbsp;&nbsp;&nbsp; ENTER CONFIRM&nbsp;&nbsp;&nbsp; ESC BACK</span>
        </footer>
      </div>
    </div>
  </div>

  <script type="module" src="./assets/app.js?v=20260921-iosnative1"></script>
</body>
</html>
